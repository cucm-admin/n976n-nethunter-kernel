name: Build Note 10 5G (SM-N976N) Kernel with AR9271

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 빌드 필수 패키지 및 ncurses5 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev bison flex libelf-dev bc ccache lz4 python3 python-is-python3 tar git wget
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.3_amd64.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.3_amd64.deb
          sudo dpkg -i libtinfo5*.deb libncurses5*.deb || sudo apt-get install -f -y

      - name: 2. 커널 소스, KernelSU 및 툴체인 다운로드
        run: |
          git clone --depth=1 https://github.com/KernelKreation/exynos9820_SUSFS_kernel.git kernel
          cd kernel
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git clone --depth=1 https://github.com/CruelKernel/samsung-exynos9820-toolchain.git toolchain

      - name: 3. AR9271 드라이버 주입 및 빌드 안전검사/플래그 패치
        run: |
          cd kernel
          # 1) AR9271 외장 무선 드라이버 활성화
          echo "CONFIG_WIRELESS=y" >> arch/arm64/configs/d2xks_defconfig
          echo "CONFIG_CFG80211=y" >> arch/arm64/configs/d2xks_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/d2xks_defconfig
          echo "CONFIG_ATH_COMMON=y" >> arch/arm64/configs/d2xks_defconfig
          echo "CONFIG_ATH9K_HW=y" >> arch/arm64/configs/d2xks_defconfig
          echo "CONFIG_ATH9K_COMMON=y" >> arch/arm64/configs/d2xks_defconfig
          echo "CONFIG_ATH9K_HTC=y" >> arch/arm64/configs/d2xks_defconfig
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> arch/arm64/configs/d2xks_defconfig

          # 2) Stack Protector 설정 완화
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' arch/arm64/configs/d2xks_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' arch/arm64/configs/d2xks_defconfig
          sed -i 's/# CONFIG_CC_STACKPROTECTOR_NONE is not set/CONFIG_CC_STACKPROTECTOR_NONE=y/' arch/arm64/configs/d2xks_defconfig

          # 3) LSE Atomics 비활성화 (표준 LL/SC 모드로 전환)
          sed -i 's/CONFIG_ARM64_LSE_ATOMICS=y/# CONFIG_ARM64_LSE_ATOMICS is not set/' arch/arm64/configs/d2xks_defconfig
          sed -i 's/CONFIG_SEC_ARM64_LSE_ATOMICS=y/# CONFIG_SEC_ARM64_LSE_ATOMICS is not set/' arch/arm64/configs/d2xks_defconfig

          # 4) olog.pb.h 누락 헤더 해결 (삼성 공식 더미 헤더로 교체)
          cp drivers/kperfmon/ologk.h include/linux/ologk.h

          # 5) NPU 버전 정보 누락 파일 해결 (삼성 공식 기본 파일로 교체)
          cp drivers/vision/npu/generated/npu-ver-info-default.c drivers/vision/npu/generated/npu-ver-info.c

          # 6) Makefile 패치 (검사 무력화 및 하드코딩 플래그 정리)
          python3 -c "import re; f=open('Makefile'); c=f.read(); f.close(); c=re.sub(r'prepare-compiler-check:\s*FORCE[\s\S]*?\t@:', 'prepare-compiler-check: FORCE\n\t@:', c).replace('-Xassembler -march=armv8-a+lse','').replace('-march=armv8-a+lse',''); f=open('Makefile','w'); f.write(c); f.close()"

          # 7) 툴체인 디렉터리 내 타깃용 aarch64-linux-gnu-* 심볼릭 링크 생성 (호스트 as/ld 보존)
          cd toolchain/gcc-cfp/gcc-cfp-jopp-only/aarch64-linux-android-4.9/bin
          for f in aarch64-linux-android-*; do
            ln -sf "$f" "${f/aarch64-linux-android-/aarch64-linux-gnu-}"
          done
          cd -

      - name: 4. SM-N976N 커널 컴파일 실행
        run: |
          cd kernel
          chmod -R +x .
          export TOOLCHAIN_DIR="$(pwd)/toolchain"
          export CLANG_DIR="$TOOLCHAIN_DIR/clang/host/linux-x86/clang-4639204-cfp-jopp"
          export GCC_DIR="$TOOLCHAIN_DIR/gcc-cfp/gcc-cfp-jopp-only/aarch64-linux-android-4.9"
          export PATH="$CLANG_DIR/bin:$GCC_DIR/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE="$GCC_DIR/bin/aarch64-linux-android-"
          export CC="$CLANG_DIR/bin/clang"

          ./build_kernel.sh N976N

      - name: 5. 완성된 Odin 및 Boot 이미지 업로드
        uses: actions/upload-artifact@v4
        with:
          name: N976N_NetHunter_Kernel_Odin
          path: kernel/out/*
